  <path d="M 70 60 L 71 63 L 74 64 L 71 65 L 70 68 L 69 65 L 66 64 L 69 63 Z" fill="#60a5fa"/>
  <path d="M 22 25 L 23 28 L 26 29 L 23 30 L 22 33 L 21 30 L 18 29 L 21 28 Z" fill="#34d399"/>
