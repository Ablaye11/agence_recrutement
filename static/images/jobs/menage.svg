<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <circle cx="50" cy="50" r="48" fill="#eff6ff"/>
  <!-- Visage femme -->
  <circle cx="50" cy="28" r="12" fill="#fcd34d"/>
  <ellipse cx="46" cy="27" rx="1.5" ry="2" fill="#78350f"/>
  <ellipse cx="54" cy="27" rx="1.5" ry="2" fill="#78350f"/>
  <path d="M 47 32 Q 50 35 53 32" stroke="#78350f" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Foulard tête -->
  <path d="M 38 25 C 38 15, 62 15, 62 25 C 62 27, 65 32, 60 34 C 58 31, 42 31, 40 34 Z" fill="#6366f1"/>
  <!-- Corps / Tenue ménage -->
  <path d="M 34 68 C 34 45, 66 45, 66 68 L 70 90 L 30 90 Z" fill="#3b82f6"/>
  <!-- Tablier blanc -->
  <path d="M 42 50 L 58 50 L 62 88 L 38 88 Z" fill="#ffffff" opacity="0.95"/>
  <rect x="45" y="66" width="10" height="8" rx="2" fill="#cbd5e1"/>
  <!-- Balai de nettoyage -->
  <g transform="translate(14, 15) rotate(15 20 60)">
    <!-- Manche du balai -->
    <rect x="18" y="10" width="4" height="65" rx="2" fill="#b45309"/>
    <!-- Tête du balai -->
    <path d="M 12 70 L 28 70 L 32 88 L 8 88 Z" fill="#f59e0b"/>
    <!-- Poils du balai -->
    <line x1="12" y1="88" x2="12" y2="92" stroke="#d97706" stroke-width="2"/>
    <line x1="16" y1="88" x2="16" y2="92" stroke="#d97706" stroke-width="2"/>
    <line x1="20" y1="88" x2="20" y2="92" stroke="#d97706" stroke-width="2"/>
    <line x1="24" y1="88" x2="24" y2="92" stroke="#d97706" stroke-width="2"/>
    <line x1="28" y1="88" x2="28" y2="92" stroke="#d97706" stroke-width="2"/>
  </g>
  <!-- Bras tenant le balai -->
  <path d="M 36 48 C 30 55, 26 58, 28 66" stroke="#fcd34d" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- Étoiles de brillance (propreté étincelante) -->
